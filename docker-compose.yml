version: '3.8'

services:
  # API Server: Receives HTTP requests and creates dispatches via lk CLI
  # This container needs the lk CLI to execute dispatch commands
  # Uses the default CMD from Dockerfile (python api_server.py)
  api-server:
    build: .
    container_name: outbound-caller-api
    ports:
      - "5000:5000"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SIP_OUTBOUND_TRUNK_ID=${SIP_OUTBOUND_TRUNK_ID}
      - AGENT_NAME=${AGENT_NAME:-outbound-caller}
      - API_PORT=5000
      - API_HOST=0.0.0.0
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
    env_file:
      - .env.local
    volumes:
      # Mount .env.local if it exists (for local development)
      - ./.env.local:/app/.env.local:ro
    # Explicitly set command (matches Dockerfile default, but makes it clear)
    command: python api_server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Agent Worker: Connects to LiveKit server and processes dispatches
  # This container does NOT need the lk CLI - it just runs the agent worker
  # Flow: API Server -> lk dispatch create -> LiveKit Server -> Agent Worker
  # Overrides Dockerfile default CMD to run the agent worker instead of Flask server
  agent:
    build: .
    container_name: outbound-caller-agent
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - SIP_OUTBOUND_TRUNK_ID=${SIP_OUTBOUND_TRUNK_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - CARTESIA_API_KEY=${CARTESIA_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    env_file:
      - .env.local
    volumes:
      # Mount .env.local if it exists (for local development)
      - ./.env.local:/app/.env.local:ro
    # Override Dockerfile default CMD - run agent worker instead of Flask server
    command: python agent.py dev
    restart: unless-stopped
    # Agent worker connects to LiveKit server independently
    # It receives job assignments when dispatches are created via the API
